name: Core method tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir -r code/environment/requirements-validated.txt
      - run: python -m pip install --no-deps -e ./code
      - run: python code/scripts/validation.py files
      - run: python -m pytest code/tests -q -p no:cacheprovider
      - run: python code/examples/generation.py
      - run: python code/scripts/benchmark.py internal --check
      - run: python code/examples/inference.py external
      - run: python code/scripts/compatibility.py score --output output/compatibility_sample.tsv --check
      - run: python code/examples/inference.py esp
      - run: python code/examples/inference.py graph
